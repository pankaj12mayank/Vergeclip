# ==============================================================================
# Render Blueprint — Vergeclip AI
# ==============================================================================
# Docker-based deployment for Render.com.
# Set all secrets in the Render dashboard (Environment → Secrets) — never commit them.
#
# Secrets you MUST set in the Render UI:
#   JWT_SECRET_KEY    →  python -c "import secrets; print(secrets.token_urlsafe(32))"
#   VIDEOSAILOR_API_KEY
#   GROQ_API_KEY
#   ASSEMBLYAI_API_KEY
#   GOOGLE_API_KEY
#   OPENAI_API_KEY
# ==============================================================================
services:
  - type: web
    name: vergeclip
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: HOST
        value: "0.0.0.0"
      - key: AUTH_REQUIRED
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      # ── Video downloader ──
      - key: VIDEOSAILOR_API_KEY
        sync: false
      # ── Transcription ──
      - key: TRANSCRIPTION_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # ── AI ranking / LLM ──
      - key: RANKING_PROVIDER
        value: "gemini"
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CUSTOM_AI_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: CUSTOM_AI_API_KEY
        sync: false
      - key: CUSTOM_AI_MODEL
        value: "llama-3.1-8b-instant"
      # ── Auth (REQUIRED) ──
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRE_MIN
        value: "10080"
      # ── ComfyUI (optional, GPU required — not used in cloud) ──
      - key: COMFYUI_URL
        value: "http://127.0.0.1:8188"
      # ── Storage ──
      - key: DISK
        value: "data"
