version: "3.8"

services:
  vergeclip:
    build: .
    container_name: vergeclip_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # ── Server ──
      - PORT=5000
      - HOST=0.0.0.0
      # ── Auth ──
      - AUTH_REQUIRED=false
      - CORS_ORIGINS=*
      - JWT_EXPIRE_MIN=10080
      # ── Video downloader ──
      - VIDEOSAILOR_API_KEY=${VIDEOSAILOR_API_KEY:-}
      # ── Transcription ──
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      # ── AI ranking / LLM ──
      - RANKING_PROVIDER=${RANKING_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CUSTOM_AI_BASE_URL=${CUSTOM_AI_BASE_URL:-https://api.groq.com/openai/v1}
      - CUSTOM_AI_API_KEY=${CUSTOM_AI_API_KEY:-}
      - CUSTOM_AI_MODEL=${CUSTOM_AI_MODEL:-llama-3.1-8b-instant}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      # ── Auth (REQUIRED: generate with: python -c "import secrets; print(secrets.token_urlsafe(32))") ──
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me}
      # ── ComfyUI (optional, GPU required) ──
      - COMFYUI_URL=${COMFYUI_URL:-http://127.0.0.1:8188}
      # ── Storage ──
      - DISK=data
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data
      - ./storage:/app/storage
