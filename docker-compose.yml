version: "3.8"

services:
  vergeclip:
    build: .
    container_name: vergeclip_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      # Video downloader
      - VIDEOSAILOR_API_KEY=${VIDEOSAILOR_API_KEY:-}
      # Transcription
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      # AI ranking
      - RANKING_PROVIDER=${RANKING_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Auth
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data
      - ./storage:/app/storage
