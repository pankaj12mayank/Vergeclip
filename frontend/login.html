<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Vergeclip</title>
  <meta name="description" content="Sign in to your Vergeclip account to access your viral video generators and saved clips." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="app-body">

  <!-- ─── Top Navbar ────────────────────────────────────────────────── -->
  <header class="app-nav">
    <div class="app-nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">🎙️</span>
        <span class="logo-text">Verge<span class="logo-accent">clip</span></span>
      </a>
      <a href="index.html" class="btn-outline btn-sm">← Back to Home</a>
    </div>
  </header>

  <!-- ─── Auth Page Body ────────────────────────────────────────────── -->
  <div class="auth-page-wrapper">
    <div class="auth-card-modern">
      <div class="auth-header">
        <div class="auth-logo-badge">🔐</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in with your username or email to access your workspace</p>
      </div>

      <form class="auth-form" onsubmit="handleLogin(event)">
        <div class="auth-field">
          <label class="auth-label" for="login_identifier">Username or Email</label>
          <div class="auth-input-container">
            <input 
              id="login_identifier" 
              class="auth-input" 
              type="text" 
              placeholder="e.g. admin or user@email.com" 
              required 
              autocomplete="username" 
            />
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="login_password">Password</label>
          <div class="auth-input-container">
            <input 
              id="login_password" 
              class="auth-input" 
              type="password" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password" 
            />
            <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('login_password', this)" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <button id="loginBtn" type="submit" class="btn-primary auth-btn" style="margin-top:0.5rem; padding:0.85rem;">
          Sign In to Account
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one for free</a>
        <div style="margin-top:0.75rem;">
          <a href="index.html" style="color:var(--text-muted); font-size:0.82rem; text-decoration:none;">← Continue as Guest</a>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Toast Notifications Container ──────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ─── Footer ─────────────────────────────────────────────────────── -->
  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-bottom-bar" style="border-top:none; padding-top:0;">
        <span>© 2026 PodcastShorts AI</span>
        <span>FastAPI & Whisper Engine</span>
      </div>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script>
    // Auto redirect if already logged in
    (async () => {
      if (localStorage.getItem('ps_auth_token')) {
        try {
          const r = await fetch((localStorage.getItem('CUSTOM_API_BASE') || window.location.origin) + '/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('ps_auth_token') }
          });
          if (r.ok) {
            const data = await r.json();
            if (data.user && data.user.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'index.html';
            }
          }
        } catch {}
      }
    })();
  </script>
</body>
</html>
