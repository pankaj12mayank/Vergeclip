<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Vergeclip</title>
  <meta name="description" content="Create a free account on Vergeclip to save and manage your generated shorts." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="app-body">

  <!-- ─── Top Navbar ────────────────────────────────────────────────── -->
  <header class="app-nav">
    <div class="app-nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">🎙️</span>
        <span class="logo-text">Verge<span class="logo-accent">clip</span></span>
      </a>
      <a href="index.html" class="btn-outline btn-sm">← Back to Home</a>
    </div>
  </header>

  <!-- ─── Auth Page Body ────────────────────────────────────────────── -->
  <div class="auth-page-wrapper">
    <div class="auth-card-modern">
      <div class="auth-header">
        <div class="auth-logo-badge">✨</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join thousands of creators making viral short clips</p>
      </div>

      <form class="auth-form" onsubmit="handleSignup(event)">
        <div class="auth-field">
          <label class="auth-label" for="su_username">Username</label>
          <div class="auth-input-container">
            <input 
              id="su_username" 
              class="auth-input" 
              type="text" 
              placeholder="e.g. alexcreator" 
              required 
              minlength="3" 
              maxlength="32" 
              pattern="^[a-zA-Z0-9_.-]+$" 
              autocomplete="username" 
            />
          </div>
          <span style="font-size:0.75rem; color:var(--text-faint);">3-32 characters, letters/numbers/_.- only</span>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="su_email">Email Address</label>
          <div class="auth-input-container">
            <input 
              id="su_email" 
              class="auth-input" 
              type="email" 
              placeholder="alex@company.com" 
              required 
              autocomplete="email" 
            />
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="su_password">Password</label>
          <div class="auth-input-container">
            <input 
              id="su_password" 
              class="auth-input" 
              type="password" 
              placeholder="•••••••• (min 8 characters)" 
              required 
              minlength="8" 
              autocomplete="new-password" 
            />
            <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('su_password', this)" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="su_password_confirm">Confirm Password</label>
          <div class="auth-input-container">
            <input 
              id="su_password_confirm" 
              class="auth-input" 
              type="password" 
              placeholder="••••••••" 
              required 
              autocomplete="new-password" 
            />
            <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('su_password_confirm', this)" title="Show/Hide Password">👁️</button>
          </div>
        </div>

        <button id="signupBtn" type="submit" class="btn-primary auth-btn" style="margin-top:0.5rem; padding:0.85rem;">
          Create Free Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
        <div style="margin-top:0.75rem;">
          <a href="index.html" style="color:var(--text-muted); font-size:0.82rem; text-decoration:none;">← Continue as Guest</a>
        </div>
      </div>

      <div style="display:flex; justify-content:center; align-items:center; gap:0.5rem; margin-top:1.5rem; font-size:0.78rem; color:var(--text-faint);">
        <span class="status-dot green" style="width:6px; height:6px;"></span>
        <span>Bcrypt Password Encryption • Zero Spam Policy</span>
      </div>
    </div>
  </div>

  <!-- ─── Toast Notifications Container ──────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ─── Footer ─────────────────────────────────────────────────────── -->
  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-bottom-bar" style="border-top:none; padding-top:0;">
        <span>© 2026 PodcastShorts AI</span>
        <span>FastAPI & Whisper Engine</span>
      </div>
    </div>
  </footer>

  <script src="auth.js"></script>
</body>
</html>
