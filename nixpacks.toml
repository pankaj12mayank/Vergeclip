# Nixpacks configuration for Railway / Render / PaaS deployments
[phases.setup]
nixPkgs = ["python311", "ffmpeg", "curl"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r requirements.txt"]

[start]
cmd = "python server.py --host 0.0.0.0 --port $PORT"
# FastAPI docs at /docs, health at /health, auth at /api/auth/*
