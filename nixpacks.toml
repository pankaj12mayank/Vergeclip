# ==============================================================================
# Nixpacks configuration for Railway / Render (Non-Docker) / PaaS deployments.
# ==============================================================================
# Installs system FFmpeg, Python deps from requirements.txt, then starts server.py.
#
# ⚠️  Local Wan2.1 / LTX-Video (ComfyUI) requires an NVIDIA GPU — NOT available in
#     most PaaS environments. Use fal.ai or Replicate for scene generation in
#     cloud deployments (configure them live in Admin → Scene Generation).
# ==============================================================================

[phases.setup]
nixPkgs = ["python311", "ffmpeg", "curl"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r requirements.txt",
]

[phases.build]
cmds = [
  "mkdir -p input output temp logs data storage frontend",
]

[start]
cmd = "python server.py --host 0.0.0.0 --port $PORT"

[env]
PYTHONUNBUFFERED = "1"
HOST = "0.0.0.0"
# Set in the platform dashboard (Environment → Secrets — never committed):
#   JWT_SECRET_KEY, VIDEOSAILOR_API_KEY, GROQ_API_KEY, ASSEMBLYAI_API_KEY,
#   GOOGLE_API_KEY, OPENAI_API_KEY, CUSTOM_AI_API_KEY, RANKING_PROVIDER,
#   TRANSCRIPTION_PROVIDER, AUTH_REQUIRED
